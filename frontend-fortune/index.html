<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>俄罗斯方块 · 拖拽版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; position: fixed; width: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Microsoft YaHei", sans-serif;
            touch-action: none;
            background: linear-gradient(135deg, #00d4aa 0%, #00c8ff 25%, #ff9f43 50%, #ff6b9d 75%, #ffe066 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .game-container {
            position: relative; z-index: 1; max-width: 420px; margin: 0 auto;
            padding: 12px; display: flex; flex-direction: column; height: 100%; gap: 8px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; flex-shrink: 0; gap: 10px; }
        .title {
            font-size: 22px; font-weight: 800; color: #fff; letter-spacing: 3px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.15);
        }
        .score-area {
            display: flex; align-items: center; gap: 8px; padding: 8px 16px;
            background: rgba(255, 255, 255, 0.35); border-radius: 25px;
        }
        .score-label { font-size: 12px; color: rgba(255,255,255,0.95); font-weight: 600; }
        .score-value {
            font-size: 24px; font-weight: 900; color: #fff; min-width: 45px; text-align: right;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.15);
        }
        .score-value.animating { animation: scoreJump 0.12s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .score-value.best { font-size: 18px; color: rgba(255,255,255,0.8); }
        @keyframes scoreJump { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
        .game-board {
            padding: 10px; flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0;
        }
        .board-grid {
            display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(20, 1fr);
            gap: 2px; background: rgba(255, 255, 255, 0.2); border-radius: 14px; padding: 6px;
            height: 100%; max-height: 100%; aspect-ratio: 10 / 20;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.08), 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .cell { background: rgba(255, 255, 255, 0.25); border-radius: 4px; transition: all 0.12s ease; }
        .cell.filled {
            border-radius: 5px;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.5), inset 0 -2px 0 rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.15);
        }
        .cell.preview { opacity: 0.7; animation: previewPulse 0.5s ease-in-out infinite; }
        @keyframes previewPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.9; } }
        .cell.preview-invalid { background: #ff6b6b !important; box-shadow: 0 0 15px rgba(255,107,107,0.6); }
        .cell.clearing { animation: clearRow 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
        @keyframes clearRow {
            0% { transform: scale(1); opacity: 1; }
            40% { transform: scale(1.2); background: #fff; box-shadow: 0 0 20px #fff; }
            100% { transform: scale(0); opacity: 0; }
        }
        .hint-area {
            text-align: center; padding: 8px; font-size: 13px; font-weight: 600;
            color: rgba(255,255,255,0.95); flex-shrink: 0; text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }
        .hint-area .emoji { margin-right: 5px; }
        .pieces-area { padding: 14px; flex-shrink: 0; }
        .pieces-container { display: flex; justify-content: space-around; align-items: center; height: 70px; }
        .piece-wrapper {
            display: flex; justify-content: center; align-items: center;
            width: 80px; height: 70px; cursor: grab; touch-action: none; border-radius: 14px;
            background: rgba(255, 255, 255, 0.3); border: 2px solid rgba(255, 255, 255, 0.4);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .piece-wrapper:hover { transform: scale(1.08) translateY(-4px); background: rgba(255,255,255,0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.12); }
        .piece-wrapper:active { transform: scale(0.95); }
        .piece-wrapper.empty { opacity: 0.3; background: transparent; border-style: dashed; }
        .piece-wrapper.dragging { opacity: 0.35; transform: scale(0.9); }
        .piece { display: grid; gap: 3px; pointer-events: none; }
        .piece-cell {
            width: 16px; height: 16px; border-radius: 4px;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.5), inset 0 -1px 0 rgba(0,0,0,0.12);
        }
        .piece-cell.empty { background: transparent !important; box-shadow: none; }
        .dragging-piece {
            position: fixed; pointer-events: none; z-index: 1000;
            transform: translate(-50%, calc(-100% - 60px)) scale(1.2);
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.25));
        }
        .dragging-piece .piece-cell {
            width: 28px; height: 28px; border-radius: 6px;
            box-shadow: inset 0 3px 0 rgba(255,255,255,0.6), inset 0 -2px 0 rgba(0,0,0,0.15), 0 4px 15px rgba(0,0,0,0.2);
        }
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; z-index: 2000;
            opacity: 0; visibility: hidden; transition: all 0.35s ease;
        }
        .overlay.show { opacity: 1; visibility: visible; }
        .game-over-modal, .guide-modal {
            background: linear-gradient(145deg, rgba(255,255,255,0.98), rgba(255,255,255,0.92));
            border-radius: 28px; padding: 32px; text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
            transform: scale(0.85) translateY(15px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 300px; width: 85%;
        }
        .overlay.show .game-over-modal, .overlay.show .guide-modal { transform: scale(1) translateY(0); }
        .game-over-title {
            font-size: 28px; font-weight: 900; margin-bottom: 6px;
            background: linear-gradient(135deg, #ff6b6b, #ff9f43);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .game-over-subtitle { font-size: 14px; color: #888; margin-bottom: 20px; }
        .game-over-subtitle.new-record { color: #ff9f43; font-weight: 700; }
        .final-score { font-size: 14px; color: #666; margin-bottom: 6px; }
        .final-score-value {
            font-size: 56px; font-weight: 900; line-height: 1.1; margin-bottom: 24px;
            background: linear-gradient(135deg, #00d4aa, #00c8ff, #ff9f43);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .restart-btn, .start-btn {
            background: linear-gradient(135deg, #00d4aa 0%, #00c8ff 100%);
            color: #fff; border: none; padding: 14px 45px; font-size: 16px; border-radius: 30px;
            cursor: pointer; font-weight: 700; letter-spacing: 1px;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 25px rgba(0, 200, 255, 0.35);
        }
        .restart-btn:hover, .start-btn:hover { transform: scale(1.05) translateY(-2px); box-shadow: 0 12px 35px rgba(0, 200, 255, 0.45); }
        .restart-btn:active, .start-btn:active { transform: scale(0.97); }
        .guide-title { font-size: 24px; font-weight: 800; color: #333; margin-bottom: 20px; }
        .guide-content { text-align: left; margin-bottom: 24px; }
        .guide-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 0;
            border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 14px; color: #444; font-weight: 500;
        }
        .guide-item:last-child { border-bottom: none; }
        .guide-icon { font-size: 20px; width: 30px; text-align: center; }
        @media (max-height: 700px) {
            .game-container { padding: 8px; gap: 5px; }
            .header { padding: 10px 14px; }
            .title { font-size: 18px; }
            .score-value { font-size: 20px; }
            .pieces-container { height: 60px; }
            .piece-wrapper { width: 68px; height: 60px; }
            .piece-cell { width: 14px; height: 14px; }
            .hint-area { padding: 5px; font-size: 12px; }
        }
        @media (max-width: 360px) {
            .game-container { padding: 8px; }
            .piece-wrapper { width: 65px; height: 58px; }
            .piece-cell { width: 13px; height: 13px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header glass-card">
            <div class="title">TETRIS</div>
            <div class="score-area">
                <span class="score-label">BEST</span>
                <span class="score-value best" id="bestScore">0</span>
            </div>
            <div class="score-area">
                <span class="score-label">SCORE</span>
                <span class="score-value" id="score">0</span>
            </div>
        </div>
        <div class="game-board glass-card">
            <div class="board-grid" id="board"></div>
        </div>
        <div class="hint-area" id="hint"><span class="emoji">👆</span>拖动方块到面板中</div>
        <div class="pieces-area glass-card">
            <div class="pieces-container" id="pieces"></div>
        </div>
    </div>
    <div class="overlay" id="overlay">
        <div class="game-over-modal">
            <div class="game-over-title">GAME OVER</div>
            <div class="game-over-subtitle" id="gameOverSubtitle">别灰心，再来一局！</div>
            <div class="final-score">最终得分</div>
            <div class="final-score-value" id="finalScore">0</div>
            <button class="restart-btn" id="restartBtn">再玩一次</button>
        </div>
    </div>
    <div class="overlay show" id="guideOverlay">
        <div class="guide-modal">
            <div class="guide-title">🎮 游戏说明</div>
            <div class="guide-content">
                <div class="guide-item"><span class="guide-icon">👆</span><span>拖动底部方块放入面板</span></div>
                <div class="guide-item"><span class="guide-icon">✅</span><span>方块不能重叠或越界</span></div>
                <div class="guide-item"><span class="guide-icon">💥</span><span>填满一行自动消除得分</span></div>
                <div class="guide-item"><span class="guide-icon">🏆</span><span>同时消N行得 N² 分</span></div>
                <div class="guide-item"><span class="guide-icon">🚫</span><span>方块放不下时游戏结束</span></div>
            </div>
            <button class="start-btn" id="startBtn">开始游戏</button>
        </div>
    </div>
    <script>
const ROWS = 20, COLS = 10;
const COLORS = {
    I: '#00d4aa', O: '#ffcc02', T: '#ff6b9d', S: '#00c8ff', Z: '#ff6b6b', J: '#00e5ff', L: '#ff9f43'
};
const SHAPES = {
    I: [[1,1,1,1]], O: [[1,1],[1,1]], T: [[0,1,0],[1,1,1]],
    S: [[0,1,1],[1,1,0]], Z: [[1,1,0],[0,1,1]], J: [[1,0,0],[1,1,1]], L: [[0,0,1],[1,1,1]]
};
const SHAPE_KEYS = Object.keys(SHAPES);
const STORAGE_KEY = 'tetris_best_score';
let board = [], score = 0, bestScore = 0, pieces = [null, null, null];
let dragging = null, dragEl = null;
let scoreAnimationId = null, hintTimeoutId = null, isClearing = false;

// 读取历史最高分
try {
    bestScore = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
} catch (e) {
    console.warn('无法读取本地存储:', e);
}
const boardEl = document.getElementById('board');
const piecesEl = document.getElementById('pieces');
const scoreEl = document.getElementById('score');
const hintEl = document.getElementById('hint');
const overlayEl = document.getElementById('overlay');
const finalScoreEl = document.getElementById('finalScore');
const restartBtn = document.getElementById('restartBtn');
const guideOverlay = document.getElementById('guideOverlay');
const startBtn = document.getElementById('startBtn');
const bestScoreEl = document.getElementById('bestScore');
const gameOverSubtitle = document.getElementById('gameOverSubtitle');

// 初始化最高分显示
bestScoreEl.textContent = bestScore;

startBtn.addEventListener('click', () => guideOverlay.classList.remove('show'));

function init() {
    board = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
    score = 0; scoreEl.textContent = '0';
    hintEl.innerHTML = '<span class="emoji">👆</span>拖动方块到面板中';
    overlayEl.classList.remove('show');
    renderBoard(); generatePieces();
}
function renderBoard() {
    boardEl.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell'; cell.dataset.row = r; cell.dataset.col = c;
            if (board[r][c]) { cell.classList.add('filled'); cell.style.background = board[r][c]; }
            boardEl.appendChild(cell);
        }
    }
}
function generatePieces() { pieces = [randomPiece(), randomPiece(), randomPiece()]; renderPieces(); }
function randomPiece() {
    const key = SHAPE_KEYS[Math.floor(Math.random() * SHAPE_KEYS.length)];
    return { shape: SHAPES[key], color: COLORS[key], type: key };
}
function renderPieces() {
    piecesEl.innerHTML = '';
    pieces.forEach((piece, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'piece-wrapper' + (piece ? '' : ' empty');
        wrapper.dataset.index = idx;
        if (piece) {
            wrapper.appendChild(createPieceElement(piece));
            wrapper.addEventListener('mousedown', e => startDrag(e, idx));
            wrapper.addEventListener('touchstart', e => startDrag(e, idx), { passive: false });
        }
        piecesEl.appendChild(wrapper);
    });
    updateHint();
}
function createPieceElement(piece) {
    const el = document.createElement('div'); el.className = 'piece';
    el.style.gridTemplateColumns = `repeat(${piece.shape[0].length}, 1fr)`;
    el.style.gridTemplateRows = `repeat(${piece.shape.length}, 1fr)`;
    piece.shape.forEach(row => row.forEach(cell => {
        const cellEl = document.createElement('div');
        cellEl.className = 'piece-cell' + (cell ? '' : ' empty');
        if (cell) cellEl.style.background = piece.color;
        el.appendChild(cellEl);
    }));
    return el;
}
function startDrag(e, idx) {
    if (!pieces[idx] || isClearing) return;
    e.preventDefault();
    dragging = { idx, piece: pieces[idx] };
    const touch = e.touches ? e.touches[0] : e;
    dragEl = document.createElement('div');
    dragEl.className = 'dragging-piece';
    dragEl.appendChild(createPieceElement(dragging.piece));
    document.body.appendChild(dragEl);
    updateDragPosition(touch.clientX, touch.clientY);
    document.querySelectorAll('.piece-wrapper')[idx].classList.add('dragging');
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchmove', onDrag, { passive: false });
    document.addEventListener('touchend', endDrag);
    document.addEventListener('touchcancel', endDrag);
}
function onDrag(e) {
    if (!dragging) return;
    e.preventDefault();
    const touch = e.touches ? e.touches[0] : e;
    updateDragPosition(touch.clientX, touch.clientY);
    showPreview(touch.clientX, touch.clientY);
}
function updateDragPosition(x, y) { if (dragEl) { dragEl.style.left = x + 'px'; dragEl.style.top = y + 'px'; } }
function getBoardPosition(clientX, clientY) {
    const rect = boardEl.getBoundingClientRect();
    return { row: Math.floor((clientY - rect.top) / (rect.height / ROWS)), col: Math.floor((clientX - rect.left) / (rect.width / COLS)) };
}
function showPreview(clientX, clientY) {
    clearPreview();
    const shape = dragging.piece.shape;
    const rect = boardEl.getBoundingClientRect();
    const cellH = rect.height / ROWS;
    // 大幅向上偏移，确保手指不遮挡落点
    const offsetY = (shape.length * cellH * 1.2) + 60;
    const adjustedY = clientY - offsetY;
    const pos = getBoardPosition(clientX, adjustedY);
    const offsetR = Math.floor(shape.length / 2), offsetC = Math.floor(shape[0].length / 2);
    const startR = pos.row - offsetR, startC = pos.col - offsetC;
    const valid = canPlace(shape, startR, startC);
    shape.forEach((row, r) => row.forEach((cell, c) => {
        if (cell) {
            const tr = startR + r, tc = startC + c;
            if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS) {
                const cellEl = boardEl.children[tr * COLS + tc];
                cellEl.classList.add(valid ? 'preview' : 'preview-invalid');
                if (valid) cellEl.style.background = dragging.piece.color;
            }
        }
    }));
}
function clearPreview() {
    boardEl.querySelectorAll('.preview, .preview-invalid').forEach(cell => {
        cell.classList.remove('preview', 'preview-invalid');
        const r = parseInt(cell.dataset.row), c = parseInt(cell.dataset.col);
        cell.style.background = board[r][c] ? board[r][c] : '';
    });
}
function canPlace(shape, startR, startC) {
    for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[0].length; c++) {
            if (shape[r][c]) {
                const tr = startR + r, tc = startC + c;
                if (tr < 0 || tr >= ROWS || tc < 0 || tc >= COLS || board[tr][tc]) return false;
            }
        }
    }
    return true;
}
function endDrag(e) {
    if (!dragging) return;
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', endDrag);
    document.removeEventListener('touchmove', onDrag);
    document.removeEventListener('touchend', endDrag);
    document.removeEventListener('touchcancel', endDrag);
    clearPreview();
    const touch = e.changedTouches ? e.changedTouches[0] : e;
    const shape = dragging.piece.shape;
    const rect = boardEl.getBoundingClientRect();
    const cellH = rect.height / ROWS;
    // 大幅向上偏移，与预览位置一致
    const offsetY = (shape.length * cellH * 1.2) + 60;
    const adjustedY = touch.clientY - offsetY;
    const pos = getBoardPosition(touch.clientX, adjustedY);
    const offsetR = Math.floor(shape.length / 2), offsetC = Math.floor(shape[0].length / 2);
    const startR = pos.row - offsetR, startC = pos.col - offsetC;
    if (canPlace(shape, startR, startC)) {
        placePiece(dragging.piece, startR, startC);
        pieces[dragging.idx] = null;
        renderPieces(); checkLines();
    } else { if (navigator.vibrate) navigator.vibrate(50); }
    document.querySelectorAll('.piece-wrapper')[dragging.idx]?.classList.remove('dragging');
    if (dragEl) { dragEl.remove(); dragEl = null; }
    dragging = null;
}
function placePiece(piece, startR, startC) {
    piece.shape.forEach((row, r) => row.forEach((cell, c) => {
        if (cell) board[startR + r][startC + c] = piece.color;
    }));
    renderBoard();
}
function checkLines() {
    // 找出所有满行
    const fullRows = [];
    for (let r = 0; r < ROWS; r++) {
        let isFull = true;
        for (let c = 0; c < COLS; c++) {
            if (!board[r][c]) {
                isFull = false;
                break;
            }
        }
        if (isFull) fullRows.push(r);
    }
    
    if (fullRows.length === 0) {
        if (pieces.every(p => p === null)) generatePieces();
        checkGameOver();
        return;
    }
    
    isClearing = true;
    
    // 播放消除动画
    fullRows.forEach(r => {
        for (let c = 0; c < COLS; c++) {
            const cellEl = boardEl.children[r * COLS + c];
            if (cellEl) cellEl.classList.add('clearing');
        }
    });
    
    showClearHint(fullRows.length);
    
    setTimeout(() => {
        // 创建新的 board，只保留非满行
        const newBoard = [];
        for (let r = 0; r < ROWS; r++) {
            if (!fullRows.includes(r)) {
                newBoard.push([...board[r]]);
            }
        }
        // 在顶部补充空行
        while (newBoard.length < ROWS) {
            newBoard.unshift(Array(COLS).fill(null));
        }
        // 替换 board
        board = newBoard;
        
        renderBoard();
        addScore(fullRows.length * fullRows.length);
        isClearing = false;
        
        if (pieces.every(p => p === null)) generatePieces();
        checkGameOver();
    }, 350);
}
function showClearHint(lines) {
    if (hintTimeoutId) clearTimeout(hintTimeoutId);
    const msgs = ['', '💥 消除 1 行！+1分', '🔥 消除 2 行！+4分', '⚡ 消除 3 行！+9分', '🌟 消除 4 行！+16分'];
    hintEl.innerHTML = msgs[lines] || `🎉 消除 ${lines} 行！+${lines*lines}分`;
    hintTimeoutId = setTimeout(() => { hintTimeoutId = null; updateHint(); }, 1500);
}
function addScore(points) {
    // 取消之前的动画
    if (scoreAnimationId) {
        clearTimeout(scoreAnimationId);
        scoreAnimationId = null;
    }
    const target = score + points;
    const step = () => {
        if (score < target) {
            score++; scoreEl.textContent = score;
            scoreEl.classList.add('animating');
            setTimeout(() => scoreEl.classList.remove('animating'), 120);
            scoreAnimationId = setTimeout(step, 35);
        } else {
            scoreAnimationId = null;
        }
    };
    step();
}
function checkGameOver() {
    const activePieces = pieces.filter(p => p !== null);
    if (activePieces.length === 0) return;
    const canPlaceAny = activePieces.some(piece => {
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (canPlace(piece.shape, r, c)) return true;
        return false;
    });
    if (!canPlaceAny) {
        setTimeout(() => {
            // 更新最高分
            const isNewRecord = score > bestScore;
            if (isNewRecord) {
                bestScore = score;
                bestScoreEl.textContent = bestScore;
                try {
                    localStorage.setItem(STORAGE_KEY, bestScore);
                } catch (e) {
                    console.warn('无法保存最高分:', e);
                }
            }
            // 更新弹窗文案
            gameOverSubtitle.textContent = isNewRecord ? '🎉 新纪录！太厉害了！' : '别灰心，再来一局！';
            gameOverSubtitle.classList.toggle('new-record', isNewRecord);
            finalScoreEl.textContent = score;
            overlayEl.classList.add('show');
        }, 450);
    }
}
function updateHint() {
    const count = pieces.filter(p => p !== null).length;
    if (count === 0) hintEl.innerHTML = '<span class="emoji">✨</span>生成新方块中...';
    else if (count < 3) hintEl.innerHTML = `<span class="emoji">🎯</span>剩余 ${count} 个方块`;
    else hintEl.innerHTML = '<span class="emoji">👆</span>拖动方块到面板中';
}
restartBtn.addEventListener('click', init);
init();
    </script>
</body>
